[project]
name = "probe"
version = "0.1.0.dev0"
description = "Verifiable adaptive experimentation: choose the next observation that best tells competing explanations apart, and produce conclusions anyone can re-check."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12,<3.15"
authors = [{ name = "PROBE contributors" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=2.1",
    "scipy>=1.14",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "pvlib>=0.11",
    "pyarrow>=17",
    "fastapi>=0.115,<0.200",
    "uvicorn>=0.32",
]

[project.scripts]
probe = "probe.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-xdist>=3.6",
    "hypothesis>=6.112",
    "ruff>=0.8",
    "mypy>=1.13",
    "dynesty>=2.1",
    "aalpy>=1.4",
    "types-PyYAML",
    "httpx>=0.28.1",
]
# Heavy independent oracle (torch). Installed only in the Linux oracle CI job:
#   uv sync --group dev --group oracle
oracle = ["pyro-ppl>=1.9"]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/probe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: long-running statistical validity tests (deselect with -m 'not slow')",
    "oracle: needs the optional heavy oracle group (pyro-ppl)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "RUF"]
ignore = ["E741", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
packages = ["probe"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
